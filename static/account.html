<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubAgents · Account</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e3e8ef;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.15);
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --header-bg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --danger: #ef4444;
      --radius-lg: 18px;
      --shadow-lg: 0 20px 50px rgba(30, 41, 59, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .wrap { width: 100%; max-width: 520px; }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .back-link {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      text-decoration: none; cursor: pointer;
    }
    .back-link:hover { color: var(--primary); }
    .back-link svg { width: 16px; height: 16px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .card-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-header h2 { font-size: 15px; font-weight: 700; }
    .profile-header {
      background: var(--header-bg);
      color: #fff;
      padding: 28px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .avatar {
      width: 52px; height: 52px; border-radius: 14px;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800;
      flex-shrink: 0;
    }
    .profile-header .email { font-size: 15px; font-weight: 700; }
    .profile-header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    form { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
    .field input {
      background: var(--bg); border: 1.5px solid var(--border); color: var(--text);
      padding: 10px 13px; border-radius: 10px; font-size: 13.5px; font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); background: var(--surface); }

    button {
      border: none; font-family: inherit; font-size: 13px; font-weight: 700;
      padding: 10px 18px; border-radius: 10px; cursor: pointer; transition: all 0.2s;
      align-self: flex-start;
    }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #818cf8); color: #fff; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3); }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .msg { font-size: 12.5px; padding: 9px 12px; border-radius: 9px; display: none; }
    .msg.show { display: block; }
    .msg.error { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.25); color: #dc2626; }
    .msg.success { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); color: #059669; }

    .danger-body { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 12px; }
    .danger-body p { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      align-items: center; justify-content: center; z-index: 50;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface); border-radius: 16px; padding: 22px; width: 90%; max-width: 360px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: var(--shadow-lg);
    }
    .modal h3 { font-size: 15px; font-weight: 700; }
    .modal p { font-size: 12.5px; color: var(--text-secondary); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .btn-ghost { background: var(--bg); color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back-link" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to chat
      </a>
    </div>

    <div class="card">
      <div class="profile-header">
        <div class="avatar" id="avatarInitial">?</div>
        <div>
          <div class="email" id="profileEmail">Loading…</div>
          <div class="sub">Account settings</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Change password</h2></div>
      <form id="pwForm">
        <div class="msg" id="pwMsg"></div>
        <div class="field">
          <label>Current password</label>
          <input type="password" id="currentPassword" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label>New password</label>
          <input type="password" id="newPassword" autocomplete="new-password" required minlength="8" />
        </div>
        <button type="submit" class="btn-primary" id="pwBtn">Update password</button>
      </form>
    </div>

    <div class="card">
      <div class="card-header"><h2>Danger zone</h2></div>
      <div class="danger-body">
        <p>Deleting your account permanently removes your profile and all chat history. This cannot be undone.</p>
        <button class="btn-danger" onclick="openDeleteModal()">Delete account</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>Delete your account?</h3>
      <p>Enter your password to confirm. All conversations will be permanently deleted.</p>
      <div class="field">
        <input type="password" id="deletePassword" placeholder="Password" />
      </div>
      <div class="msg" id="deleteMsg"></div>
      <div class="modal-actions">
        <button class="btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete forever</button>
      </div>
    </div>
  </div>

  <script>
    function showMsg(el, text, kind) {
      el.textContent = text;
      el.className = `msg show ${kind}`;
    }

    async function loadProfile() {
      const res = await fetch("/auth/me", { credentials: "include" });
      if (!res.ok) { window.location.href = "/login"; return; }
      const user = await res.json();
      document.getElementById("profileEmail").textContent = user.email;
      document.getElementById("avatarInitial").textContent = user.email[0].toUpperCase();
    }
    loadProfile();

    document.getElementById("pwForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pwMsg = document.getElementById("pwMsg");
      const pwBtn = document.getElementById("pwBtn");
      const current_password = document.getElementById("currentPassword").value;
      const new_password = document.getElementById("newPassword").value;
      pwBtn.disabled = true;
      try {
        const res = await fetch("/auth/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ current_password, new_password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "Could not update password.");
        showMsg(pwMsg, "Password updated.", "success");
        e.target.reset();
      } catch (err) {
        showMsg(pwMsg, err.message, "error");
      } finally {
        pwBtn.disabled = false;
      }
    });

    function openDeleteModal() { document.getElementById("deleteModal").classList.add("show"); }
    function closeDeleteModal() {
      document.getElementById("deleteModal").classList.remove("show");
      document.getElementById("deletePassword").value = "";
      document.getElementById("deleteMsg").className = "msg";
    }

    async function confirmDelete() {
      const deleteMsg = document.getElementById("deleteMsg");
      const btn = document.getElementById("confirmDeleteBtn");
      const password = document.getElementById("deletePassword").value;
      btn.disabled = true;
      try {
        const res = await fetch("/auth/account", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "Could not delete account.");
        window.location.href = "/login";
      } catch (err) {
        showMsg(deleteMsg, err.message, "error");
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
