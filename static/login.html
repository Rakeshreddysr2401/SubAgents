<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubAgents · Sign in</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e3e8ef;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.15);
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --header-bg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --radius-lg: 18px;
      --radius-md: 14px;
      --shadow-lg: 0 20px 50px rgba(30, 41, 59, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, #eef0ff 0%, var(--bg) 55%);
      color: var(--text);
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .card-header {
      background: var(--header-bg);
      padding: 32px 32px 26px;
      text-align: center;
      color: #fff;
    }
    .logo-icon {
      width: 48px; height: 48px;
      margin: 0 auto 14px;
      background: rgba(255,255,255,0.18);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 26px; height: 26px; color: #fff; }
    .card-header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
    .card-header p { font-size: 12.5px; opacity: 0.85; margin-top: 4px; }

    .tabs {
      display: flex;
      margin: 20px 24px 0;
      background: var(--bg);
      border-radius: 10px;
      padding: 3px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active { background: var(--surface); color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

    form { padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-muted);
    }
    .field input {
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 13.5px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: var(--surface);
    }
    .hint { font-size: 11px; color: var(--text-muted); }

    button[type="submit"] {
      margin-top: 4px;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      border: none;
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      padding: 11px 0;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }
    button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #dc2626;
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: 9px;
    }
    .error-box.show { display: block; }

    .switch-hint { text-align: center; font-size: 12px; color: var(--text-muted); }
    .switch-hint a { color: var(--primary); font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <h1>SubAgents</h1>
      <p>Your multi-agent AI assistant</p>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="setMode('login')">Sign in</div>
      <div class="tab" id="tabSignup" onclick="setMode('signup')">Create account</div>
    </div>

    <form id="authForm">
      <div class="error-box" id="errorBox"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••" minlength="8" />
        <span class="hint" id="passwordHint" style="display:none;">At least 8 characters</span>
      </div>
      <button type="submit" id="submitBtn">Sign in</button>
      <div class="switch-hint" id="switchHint">
        Don't have an account? <a onclick="setMode('signup')">Create one</a>
      </div>
    </form>
  </div>

  <script>
    let mode = "login";
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const submitBtn = document.getElementById("submitBtn");
    const switchHint = document.getElementById("switchHint");
    const passwordHint = document.getElementById("passwordHint");
    const passwordInput = document.getElementById("password");
    const errorBox = document.getElementById("errorBox");
    const form = document.getElementById("authForm");

    function setMode(next) {
      mode = next;
      const isLogin = mode === "login";
      tabLogin.classList.toggle("active", isLogin);
      tabSignup.classList.toggle("active", !isLogin);
      submitBtn.textContent = isLogin ? "Sign in" : "Create account";
      passwordInput.autocomplete = isLogin ? "current-password" : "new-password";
      passwordHint.style.display = isLogin ? "none" : "block";
      switchHint.innerHTML = isLogin
        ? 'Don\'t have an account? <a onclick="setMode(\'signup\')">Create one</a>'
        : 'Already have an account? <a onclick="setMode(\'login\')">Sign in</a>';
      hideError();
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add("show");
    }
    function hideError() {
      errorBox.classList.remove("show");
    }

    // Already signed in? Skip straight to the app.
    fetch("/auth/me", { credentials: "include" })
      .then((r) => { if (r.ok) window.location.href = "/"; })
      .catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();
      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;
      if (mode === "signup" && password.length < 8) {
        showError("Password must be at least 8 characters.");
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = mode === "login" ? "Signing in…" : "Creating account…";
      try {
        const res = await fetch(`/auth/${mode}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "Something went wrong.");
        window.location.href = "/";
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = mode === "login" ? "Sign in" : "Create account";
      }
    });
  </script>
</body>
</html>
