<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubAgents</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --surface-alt: #f7f9fc;
      --border: #e3e8ef;
      --border-light: #eef1f6;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: rgba(99, 102, 241, 0.07);
      --primary-glow: rgba(99, 102, 241, 0.15);
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --user-bubble: linear-gradient(135deg, #6366f1, #818cf8);
      --bot-bubble: #ffffff;
      --code-bg: #f8fafc;
      --code-border: #e2e8f0;
      --green: #10b981;
      --green-light: rgba(16, 185, 129, 0.1);
      --header-bg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --accent: #f59e0b;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 58px;
      background: var(--header-bg);
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(99, 102, 241, 0.2);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .logo-icon svg {
      width: 20px; height: 20px;
      color: #fff;
    }
    .header h1 {
      font-size: 17px; font-weight: 700; color: #fff;
      letter-spacing: -0.3px;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-pill {
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.15);
      padding: 5px 14px;
      border-radius: 20px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      backdrop-filter: blur(4px);
    }
    .header-btn {
      padding: 7px 16px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }
    .header-btn:hover {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.4);
      transform: translateY(-1px);
    }

    /* ── User menu ── */
    .user-menu { position: relative; }
    .user-avatar-btn {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 4px 12px 4px 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .user-avatar-btn:hover { background: rgba(255,255,255,0.22); }
    .user-avatar-btn .avatar-circle {
      width: 24px; height: 24px; border-radius: 50%;
      background: #fff; color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800;
      flex-shrink: 0;
    }
    .user-avatar-btn .user-email {
      font-size: 12px; font-weight: 600; color: #fff;
      max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .user-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 190px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      z-index: 30;
    }
    .user-dropdown.open { display: block; }
    .user-dropdown-email {
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-light);
      word-break: break-all;
    }
    .user-dropdown-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      font-size: 13px; font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }
    .user-dropdown-item:hover { background: var(--bg); }
    .user-dropdown-item svg { width: 15px; height: 15px; color: var(--text-secondary); }
    .user-dropdown-item.danger { color: #dc2626; }
    .user-dropdown-item.danger svg { color: #dc2626; }

    /* ── History sidebar ── */
    .history-sidebar {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #fbfbfe;
      border-right: 1px solid var(--border-light);
      padding: 14px 12px;
      gap: 10px;
      overflow: hidden;
    }
    .new-chat-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--primary);
      font-size: 12.5px; font-weight: 700;
      padding: 10px 0;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .new-chat-btn:hover { background: var(--primary-light); border-color: var(--primary); }
    .new-chat-btn svg { width: 15px; height: 15px; }

    .thread-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .thread-list::-webkit-scrollbar { width: 4px; }
    .thread-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .thread-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-secondary);
      transition: background 0.15s;
      position: relative;
    }
    .thread-item:hover { background: var(--border-light); }
    .thread-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .thread-item .thread-title {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .thread-item .thread-delete {
      opacity: 0; width: 20px; height: 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; color: var(--text-muted);
    }
    .thread-item:hover .thread-delete { opacity: 1; }
    .thread-item .thread-delete:hover { background: rgba(239,68,68,0.15); color: #dc2626; }
    .thread-item .thread-delete svg { width: 13px; height: 13px; }
    .thread-empty { font-size: 11.5px; color: var(--text-muted); text-align: center; padding: 20px 8px; }

    /* ── Main layout ── */
    .main-content {
      flex: 1;
      display: flex;
      min-height: 0;
      gap: 0;
    }

    /* ── Left panel ── */
    .left-panel {
      width: 400px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      background: var(--bg);
      border-right: 1px solid var(--border-light);
      overflow-y: auto;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 0 4px;
    }
    .section-label svg {
      width: 13px; height: 13px;
      opacity: 0.6;
    }

    /* ── Video card ── */
    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
      transition: all 0.25s;
    }
    .video-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #d1d5db;
    }
    .video-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .video-card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .video-card-title svg {
      width: 16px; height: 16px;
      color: var(--primary);
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: var(--green-light);
      color: var(--green);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .live-badge.active { opacity: 1; }
    .live-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .video-viewport {
      position: relative;
      aspect-ratio: 16 / 10;
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      margin: 0 10px 10px;
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .video-viewport video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
    }
    .video-viewport video.active { display: block; }
    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .video-placeholder .icon-ring {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.04);
    }
    .video-placeholder .icon-ring svg {
      width: 28px; height: 28px;
      color: rgba(255,255,255,0.25);
    }
    .video-placeholder span {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      font-weight: 500;
    }
    .video-controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }
    .cam-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
    }
    .cam-btn svg { width: 20px; height: 20px; }
    .cam-btn:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
      transform: scale(1.08);
    }
    .cam-btn.on {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }
    .cam-btn.on:hover {
      background: #059669;
      border-color: #059669;
    }

    /* ── Tools card ── */
    .tools-card {
      flex: 1;
      min-height: 120px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.25s;
    }
    .tools-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #d1d5db;
    }
    .tools-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .tools-card-header svg {
      width: 16px; height: 16px;
      color: var(--primary);
    }
    .tools-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .tools-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0.4;
    }
    .tools-empty svg {
      width: 28px; height: 28px;
      color: var(--text-muted);
    }
    .tools-empty span {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ── Right panel ── */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--surface-alt);
    }

    /* ── Chat area ── */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
      min-height: 0;
    }
    .chat-container::-webkit-scrollbar { width: 5px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Welcome ── */
    .welcome {
      text-align: center;
      margin: auto;
      max-width: 440px;
      padding: 20px;
    }
    .welcome-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      color: #ffffff;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }
    .welcome-icon svg {
      width: 28px; height: 28px;
    }
    .welcome h2 {
      font-size: 22px; font-weight: 800; margin-bottom: 8px;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .welcome p {
      color: var(--text-secondary); font-size: 14px; line-height: 1.6;
    }
    .welcome-hints {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .hint-chip {
      padding: 9px 18px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hint-chip:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }

    /* ── Messages ── */
    .message {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot  { align-self: flex-start; }
    .avatar {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      flex-shrink: 0;
    }
    .message.user .avatar { background: linear-gradient(135deg, #6366f1, #818cf8); color: #fff; }
    .message.bot  .avatar { background: linear-gradient(135deg, #8b5cf6, #a78bfa); color: #fff; }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      line-height: 1.65;
      word-break: break-word;
    }
    .message.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
    }
    .message.bot .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    /* ── Markdown ── */
    .bubble .md-content { font-size: 13.5px; line-height: 1.65; color: var(--text); }
    .bubble .md-content p { margin: 0 0 8px 0; }
    .bubble .md-content p:last-child { margin-bottom: 0; }
    .bubble .md-content strong { font-weight: 600; }
    .bubble .md-content h1, .bubble .md-content h2, .bubble .md-content h3 {
      font-weight: 700; margin: 12px 0 6px 0; color: var(--text);
    }
    .bubble .md-content h1:first-child, .bubble .md-content h2:first-child, .bubble .md-content h3:first-child { margin-top: 0; }
    .bubble .md-content h1 { font-size: 16px; }
    .bubble .md-content h2 { font-size: 15px; }
    .bubble .md-content h3 { font-size: 14px; }
    .bubble .md-content ul, .bubble .md-content ol { margin: 6px 0; padding-left: 18px; }
    .bubble .md-content li { margin-bottom: 3px; }
    .bubble .md-content li::marker { color: var(--primary); }
    .bubble .md-content code {
      background: var(--code-bg); border: 1px solid var(--code-border);
      padding: 2px 6px; border-radius: 5px;
      font-family: 'Cascadia Code', monospace; font-size: 12px; color: #7c3aed;
    }
    .bubble .md-content pre {
      background: #1e293b; color: #e2e8f0;
      padding: 14px 16px; border-radius: var(--radius-sm);
      overflow-x: auto; margin: 8px 0; font-size: 12px;
      line-height: 1.5; position: relative;
    }
    .bubble .md-content pre code {
      background: none; border: none; padding: 0; color: inherit; font-size: inherit;
    }
    .code-block-wrapper { position: relative; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
      color: #94a3b8; font-size: 10px; padding: 3px 9px;
      border-radius: 5px; cursor: pointer; transition: all 0.15s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.2); color: #e2e8f0; }
    .bubble .md-content blockquote {
      border-left: 3px solid var(--primary); padding: 6px 14px; margin: 8px 0;
      background: var(--primary-light); border-radius: 0 8px 8px 0;
    }
    .bubble .md-content blockquote p { margin: 0; }
    .bubble .md-content table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 12px; }
    .bubble .md-content th, .bubble .md-content td {
      border: 1px solid var(--border); padding: 6px 10px; text-align: left;
    }
    .bubble .md-content th { background: var(--code-bg); font-weight: 600; }
    .bubble .md-content a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .bubble .md-content a:hover { text-decoration: underline; }
    .bubble .md-content hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

    /* ── Typing ── */
    .typing { display: flex; gap: 5px; padding: 12px 16px; align-items: center; }
    .typing span {
      width: 7px; height: 7px; background: var(--primary);
      border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; opacity: 0.4;
    }
    .typing span:nth-child(2) { animation-delay: 0.16s; }
    .typing span:nth-child(3) { animation-delay: 0.32s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── Thinking (LLM reasoning) — classic soft-gradient pill ── */
    .message.bot .bubble.thinking-active {
      width: fit-content;
      max-width: 100%;
      padding: 7px 14px;
      border-radius: 14px;
      border: 1px solid rgba(99,102,241,0.14);
      background: linear-gradient(120deg,
        #e0e7ff, #ede9fe, #fce7f3, #dcfce7, #cffafe, #e0e7ff);
      background-size: 280% 100%;
      animation: thinking-flow 5s linear infinite;
      box-shadow: 0 1px 6px rgba(99,102,241,0.10);
    }
    @keyframes thinking-flow {
      0%   { background-position: 0% 50%; }
      100% { background-position: 280% 50%; }
    }
    .thinking-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 12.5px; font-weight: 600;
      color: #64748b;                 /* slate — classic on the soft background */
      letter-spacing: 0.2px;
    }
    .thinking-label .tdots { display: inline-flex; gap: 3px; }
    .thinking-label .tdots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: #8b5cf6;            /* subtle brand-purple dots */
      animation: bounce 1.4s infinite ease-in-out;
    }
    .thinking-label .tdots span:nth-child(2) { animation-delay: 0.16s; }
    .thinking-label .tdots span:nth-child(3) { animation-delay: 0.32s; }

    /* Honor reduced-motion: keep colors, drop the animation */
    @media (prefers-reduced-motion: reduce) {
      .message.bot .bubble.thinking-active,
      .thinking-label .tdots span { animation: none; }
    }

    /* ── Input ── */
    .input-area {
      padding: 14px 20px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 800px;
      margin: 0 auto;
    }
    #chatInput {
      flex: 1;
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
    }
    #chatInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: var(--surface);
    }
    #chatInput::placeholder { color: var(--text-muted); }
    #sendBtn {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
    }
    #sendBtn:hover { transform: scale(1.06); box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35); }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
    #sendBtn svg { width: 18px; height: 18px; }

    .mic-btn {
      width: 44px; height: 44px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .mic-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
    .mic-btn.active {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
      animation: pulse-mic 1.5s infinite;
    }
    @keyframes pulse-mic {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-btn svg { width: 18px; height: 18px; }

    .input-hint {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* ── Error toast ── */
    .error-toast {
      position: fixed; top: 16px; right: 16px;
      background: linear-gradient(135deg, #ef4444, #dc2626); color: white;
      padding: 12px 20px; border-radius: 12px; font-size: 13px;
      z-index: 100; animation: slideIn 0.3s ease; max-width: 380px;
      box-shadow: 0 4px 20px rgba(220,38,38,0.3);
      font-weight: 500;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .main-content { flex-direction: column; }
      .history-sidebar {
        width: 100%; height: auto; max-height: 160px;
        border-right: none;
        border-bottom: 1px solid var(--border-light);
      }
      .left-panel {
        width: 100%; height: auto;
        flex-direction: row;
        border-right: none;
        border-bottom: 1px solid var(--border-light);
        overflow-x: auto;
        padding: 12px;
      }
      .left-panel > * { min-width: 280px; }
      .right-panel { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <h1>SubAgents</h1>
    </div>
    <div class="header-right">
      <div class="header-pill" style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 10px;">VOICE:</span>
        <button id="voiceToggle" class="btn-tiny" style="width: 60px; padding: 2px 0;" onclick="toggleVoiceResponse()">OFF</button>
      </div>
      <span class="header-pill" id="threadDisplay">No thread</span>
      <div class="user-menu" id="userMenu">
        <button class="user-avatar-btn" onclick="toggleUserMenu()">
          <span class="avatar-circle" id="userAvatarInitial">?</span>
          <span class="user-email" id="userEmailLabel">…</span>
        </button>
        <div class="user-dropdown" id="userDropdown">
          <div class="user-dropdown-email" id="userDropdownEmail"></div>
          <div class="user-dropdown-item" onclick="window.location.href='/account'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Account settings
          </div>
          <div class="user-dropdown-item danger" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log out
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main-content">

    <!-- Chat history sidebar -->
    <div class="history-sidebar">
      <button class="new-chat-btn" onclick="newThread()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
      <div class="thread-list" id="threadList">
        <div class="thread-empty">No conversations yet</div>
      </div>
    </div>

    <!-- Left panel -->
    <div class="left-panel">

      <div class="section-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Panels
      </div>

      <!-- Video card -->
      <div class="video-card">
        <div class="video-card-header">
          <div class="video-card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            Camera
          </div>
          <div class="live-badge" id="cameraBadge">
            <div class="dot"></div>
            LIVE
          </div>
        </div>
        <div class="video-viewport">
          <video id="cameraVideo" autoplay playsinline muted></video>
          <div class="video-placeholder" id="cameraPlaceholder">
            <div class="icon-ring">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
            </div>
            <span>Enable camera to start</span>
          </div>
          <div class="video-controls">
            <button class="cam-btn" id="cameraBtn" onclick="toggleCamera()" title="Toggle camera">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Tools card -->
      <div class="tools-card">
        <div class="tools-card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
          </svg>
          Tools
        </div>
        <div class="tools-body">
          <div class="tools-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            <span>Coming soon</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Right panel — Chat -->
    <div class="right-panel">
      <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcomeMsg">
          <div class="welcome-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
          </div>
          <h2>SubAgents</h2>
          <p>Your multi-agent AI assistant.<br/>Try one of these to get started:</p>
          <div class="welcome-hints">
            <button class="hint-chip" onclick="useHint(this)">What can you do?</button>
            <button class="hint-chip" onclick="useHint(this)">Help me with a task</button>
            <button class="hint-chip" onclick="useHint(this)">Tell me about yourself</button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <button id="micBtn" class="mic-btn" onclick="toggleSpeech()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          <textarea id="chatInput" rows="1" placeholder="Type or speak..." autofocus></textarea>
          <button id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="input-hint">Enter to send &middot; Shift+Enter for new line</div>
      </div>
    </div>

  </div>

  <script>
    marked.setOptions({ breaks: true, gfm: true });

    // Assign a real thread id up front so the camera frame WS and /chat share
    // the same thread from the very first message (avoids the "pending" race
    // where early frames land under a thread the chat never uses).
    let threadId = crypto.randomUUID();
    let sending = false;
    const API_BASE = window.location.origin;

    const chatContainer = document.getElementById("chatContainer");
    const chatInput     = document.getElementById("chatInput");
    const sendBtn       = document.getElementById("sendBtn");
    const threadDisplay = document.getElementById("threadDisplay");
    const welcomeMsg    = document.getElementById("welcomeMsg");
    const threadListEl  = document.getElementById("threadList");

    threadDisplay.textContent = threadId.slice(0, 8) + "...";
    threadDisplay.title = threadId;

    chatInput.addEventListener("input", () => {
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
    });
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // ── Auth: fetch with silent access-token refresh on 401 ──
    async function authFetch(url, options = {}) {
      const opts = { ...options, credentials: "include" };
      let res = await fetch(url, opts);
      if (res.status === 401) {
        const refreshed = await fetch("/auth/refresh", { method: "POST", credentials: "include" });
        if (refreshed.ok) {
          res = await fetch(url, opts);
        } else {
          window.location.href = "/login";
          throw new Error("Session expired");
        }
      }
      return res;
    }

    // ── User menu ──
    let currentUser = null;

    async function loadCurrentUser() {
      try {
        const res = await fetch("/auth/me", { credentials: "include" });
        if (!res.ok) { window.location.href = "/login"; return; }
        currentUser = await res.json();
        document.getElementById("userEmailLabel").textContent = currentUser.email;
        document.getElementById("userDropdownEmail").textContent = currentUser.email;
        document.getElementById("userAvatarInitial").textContent = currentUser.email[0].toUpperCase();
      } catch {
        window.location.href = "/login";
      }
    }

    function toggleUserMenu() {
      document.getElementById("userDropdown").classList.toggle("open");
    }
    document.addEventListener("click", (e) => {
      const menu = document.getElementById("userMenu");
      if (menu && !menu.contains(e.target)) document.getElementById("userDropdown").classList.remove("open");
    });

    async function logout() {
      await fetch("/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = "/login";
    }

    // ── Chat history sidebar ──
    function timeAgo(iso) {
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    async function loadThreads() {
      try {
        const res = await authFetch("/threads");
        if (!res.ok) return;
        renderThreads(await res.json());
      } catch { /* non-fatal */ }
    }

    function renderThreads(threads) {
      threadListEl.innerHTML = "";
      if (!threads.length) {
        threadListEl.innerHTML = '<div class="thread-empty">No conversations yet</div>';
        return;
      }
      for (const t of threads) {
        const item = document.createElement("div");
        item.className = "thread-item" + (t.id === threadId ? " active" : "");
        item.title = `${t.title} · ${timeAgo(t.updated_at)}`;
        item.onclick = () => selectThread(t.id);

        const title = document.createElement("span");
        title.className = "thread-title";
        title.textContent = t.title;

        const del = document.createElement("span");
        del.className = "thread-delete";
        del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
        del.onclick = (e) => { e.stopPropagation(); deleteThread(t.id); };

        item.appendChild(title);
        item.appendChild(del);
        threadListEl.appendChild(item);
      }
    }

    async function deleteThread(id) {
      await authFetch(`/threads/${id}`, { method: "DELETE" });
      if (id === threadId) newThread();
      loadThreads();
    }

    async function selectThread(id) {
      if (id === threadId) return;
      try {
        const res = await authFetch(`/threads/${id}/messages`);
        if (!res.ok) throw new Error("Could not load that conversation.");
        const data = await res.json();
        threadId = id;
        threadDisplay.textContent = threadId.slice(0, 8) + "...";
        threadDisplay.title = threadId;
        chatContainer.innerHTML = "";
        if (data.messages.length) {
          welcomeMsg.style.display = "none";
          for (const m of data.messages) addMessage(m.role === "human" ? "user" : "bot", m.content);
        } else {
          chatContainer.appendChild(welcomeMsg);
          welcomeMsg.style.display = "";
        }
        loadThreads();
        if (cameraActive) reconnectFrameWS();
      } catch (err) {
        showError(err.message);
      }
    }

    function newThread() {
      threadId = crypto.randomUUID();
      threadDisplay.textContent = threadId.slice(0, 8) + "...";
      threadDisplay.title = threadId;
      chatContainer.innerHTML = "";
      chatContainer.appendChild(welcomeMsg);
      welcomeMsg.style.display = "";
      chatInput.focus();
      loadThreads();
      if (cameraActive) reconnectFrameWS();  // frames follow the new thread
    }

    function renderMarkdown(text) {
      if (!text) return "";
      return DOMPurify.sanitize(marked.parse(text), { ADD_TAGS: ['pre','code'], ADD_ATTR: ['class'] });
    }

    function addCopyButtons(container) {
      container.querySelectorAll('pre').forEach((pre) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', () => {
          const code = pre.querySelector('code') ? pre.querySelector('code').textContent : pre.textContent;
          navigator.clipboard.writeText(code).then(() => {
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 2000);
          });
        });
        wrapper.appendChild(btn);
      });
    }

    function scrollToBottom() {
      requestAnimationFrame(() => chatContainer.scrollTop = chatContainer.scrollHeight);
    }

    function addMessage(role, text) {
      if (welcomeMsg) welcomeMsg.style.display = "none";
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "U" : "S";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "bot") {
        const mdDiv = document.createElement("div");
        mdDiv.className = "md-content";
        mdDiv.innerHTML = renderMarkdown(text);
        bubble.appendChild(mdDiv);
        setTimeout(() => addCopyButtons(mdDiv), 0);
      } else {
        bubble.textContent = text;
      }
      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      scrollToBottom();
      return msgDiv;
    }

    function showTyping() {
      const d = document.createElement("div"); d.className = "message bot"; d.id = "typingIndicator";
      const a = document.createElement("div"); a.className = "avatar"; a.textContent = "S";
      const b = document.createElement("div"); b.className = "bubble typing";
      b.innerHTML = "<span></span><span></span><span></span>";
      d.appendChild(a); d.appendChild(b); chatContainer.appendChild(d); scrollToBottom();
    }
    function hideTyping() { const el = document.getElementById("typingIndicator"); if (el) el.remove(); }

    function showError(msg) {
      const t = document.createElement("div"); t.className = "error-toast"; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => { t.style.transition="opacity 0.3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); }, 4500);
    }

    function useHint(btn) { chatInput.value = btn.textContent; sendMessage(); }

    // ── Camera ──
    let cameraActive = false, cameraStream = null, frameInterval = null, frameWS = null;
    const cameraBtn = document.getElementById("cameraBtn");
    const cameraVideo = document.getElementById("cameraVideo");
    const cameraPlaceholder = document.getElementById("cameraPlaceholder");
    const cameraBadge = document.getElementById("cameraBadge");
    const captureCanvas = document.createElement("canvas");
    const captureCtx = captureCanvas.getContext("2d");

    async function toggleCamera() { cameraActive ? stopCamera() : await startCamera(); }

    async function startCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
        cameraVideo.srcObject = cameraStream;
        cameraVideo.classList.add("active");
        cameraPlaceholder.style.display = "none";
        cameraBadge.classList.add("active");
        cameraBtn.classList.add("on");
        cameraActive = true;
        cameraVideo.addEventListener("loadedmetadata", () => {
          captureCanvas.width = cameraVideo.videoWidth;
          captureCanvas.height = cameraVideo.videoHeight;
        }, { once: true });
        startFrameCapture();
      } catch (err) { showError("Camera access denied: " + err.message); }
    }

    function stopCamera() {
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
      cameraVideo.srcObject = null;
      cameraVideo.classList.remove("active");
      cameraPlaceholder.style.display = "";
      cameraBadge.classList.remove("active");
      cameraBtn.classList.remove("on");
      if (frameInterval) { clearInterval(frameInterval); frameInterval = null; }
      if (frameWS) { frameWS.close(); frameWS = null; }
      cameraActive = false;
    }

    function startFrameCapture() {
      connectFrameWS();
      frameInterval = setInterval(() => { if (cameraActive && cameraStream) captureAndSendFrame(); }, 2000);
    }

    function connectFrameWS() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      frameWS = new WebSocket(`${proto}//${location.host}/ws/frames?thread_id=${threadId||"pending"}`);
      frameWS.onopen = () => console.log("Frame WS connected");
      frameWS.onclose = () => console.log("Frame WS closed");
      frameWS.onerror = (e) => console.warn("Frame WS error:", e);
    }

    function reconnectFrameWS() {
      if (frameWS) { frameWS.close(); frameWS = null; }
      if (cameraActive) connectFrameWS();
    }

    function captureAndSendFrame() {
      if (!cameraVideo.videoWidth) return;
      captureCanvas.width = cameraVideo.videoWidth;
      captureCanvas.height = cameraVideo.videoHeight;
      captureCtx.drawImage(cameraVideo, 0, 0);
      const b64 = captureCanvas.toDataURL("image/jpeg", 0.6).split(",")[1];
      if (frameWS && frameWS.readyState === WebSocket.OPEN) frameWS.send(b64);
    }

    let alwaysSpeak = false;

    function toggleVoiceResponse() {
      alwaysSpeak = !alwaysSpeak;
      const btn = document.getElementById("voiceToggle");
      btn.textContent = alwaysSpeak ? "ON" : "OFF";
      btn.style.color = alwaysSpeak ? "var(--green)" : "var(--text-secondary)";
      btn.style.borderColor = alwaysSpeak ? "var(--green)" : "var(--border)";
    }

    // ── Speech Recognition ──
    let recognition = null;
    let isListening = false;
    const micBtn = document.getElementById("micBtn");

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("active");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = transcript;
        sendMessage();
      };

      recognition.onerror = (event) => {
        console.error("Speech error", event.error);
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      micBtn.style.display = "none";
    }

    function toggleSpeech() {
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove("active");
    }

    // ── Wake Word Listener (SSE) ──
    function setupEventSource() {
      const source = new EventSource("/events");
      source.onmessage = (event) => {
        if (event.data === "start_voice") {
          console.log("Wake word detected via backend trigger!");
          if (!isListening) toggleSpeech();
        }
      };
      source.onerror = (err) => {
        console.warn("SSE connection lost, reconnecting...");
        source.close();
        setTimeout(setupEventSource, 3000);
      };
    }
    setupEventSource();
    loadCurrentUser();
    loadThreads();

    // ── Send message ──
    async function sendMessage() {
      const query = chatInput.value.trim();
      if (!query || sending) return;

      sending = true; sendBtn.disabled = true;
      chatInput.value = ""; chatInput.style.height = "auto";
      addMessage("user", query);
      
      // Create a bot message bubble that we will update progressively
      const botMsgDiv = document.createElement("div");
      botMsgDiv.className = "message bot";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "S";
      const bubble = document.createElement("div");
      bubble.className = "bubble thinking-active";   // animated multi-color while reasoning
      const mdDiv = document.createElement("div");
      mdDiv.className = "md-content";
      bubble.appendChild(mdDiv);
      botMsgDiv.appendChild(avatar);
      botMsgDiv.appendChild(bubble);

      // "Thinking…" state shown until the first token streams in
      mdDiv.innerHTML =
        '<div class="thinking-label">Thinking' +
        '<span class="tdots"><span></span><span></span><span></span></span></div>';

      chatContainer.appendChild(botMsgDiv);
      scrollToBottom();

      let fullText = "";

      try {
        const url = new URL("/chat", API_BASE);
        if (threadId) url.searchParams.set("thread_id", threadId);

        const response = await authFetch(url.toString(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, always_speak: alwaysSpeak }),
        });

                if (!response.ok) {
          const e = await response.json().catch(() => ({ detail: response.statusText }));
          throw new Error(e.detail || `HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let sseBuffer = "";

        // Keep the animated "Thinking…" bubble until the first real token
        // arrives (headers come back before the model starts generating).
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          // Buffer partial lines: only process up to the last newline
          sseBuffer += decoder.decode(value, { stream: true });
          const lastNewline = sseBuffer.lastIndexOf("\n");
          if (lastNewline === -1) continue;
          const lines = sseBuffer.slice(0, lastNewline).split("\n");
          sseBuffer = sseBuffer.slice(lastNewline + 1);

          let chunkText = "";
          for (const line of lines) {
            if (line.startsWith("data: ")) {
              let parsed;
              try {
                parsed = JSON.parse(line.slice(6));
              } catch {
                continue;
              }

              if (parsed.error) {
                throw new Error(parsed.error);
              }

              if (parsed.done) {
                const newTid = parsed.thread_id;
                if (newTid && threadId !== newTid) {
                  threadId = newTid;
                  threadDisplay.textContent = threadId.slice(0, 8) + "...";
                  threadDisplay.title = threadId;
                  if (cameraActive) reconnectFrameWS();
                }
                continue;
              }

              if (parsed.delta) {
                // Token stream: append raw, no separator
                chunkText += parsed.delta;
              } else if (parsed.text) {
                // Legacy full-text events
                if (chunkText !== "") chunkText += "\n";
                chunkText += parsed.text;
              }
            }
          }

          if (chunkText) {
            // First token: leave the "Thinking…" state, revert to a normal bubble
            if (bubble.classList.contains("thinking-active")) {
              bubble.classList.remove("thinking-active");
            }
            fullText += chunkText;
            mdDiv.innerHTML = renderMarkdown(fullText);
            scrollToBottom();
          }
        }

        // Add copy buttons to the finished message
        addCopyButtons(mdDiv);
        loadThreads();

      } catch (err) {
        mdDiv.innerHTML = `<div style="color: #ef4444; font-weight: 500;">Error: ${err.message}</div>`;
        showError(err.message);
      } finally {
        bubble.classList.remove("thinking-active");  // always clean up (errors / empty replies)
        sending = false; sendBtn.disabled = false; chatInput.focus();
      }
    }
  </script>
</body>
</html>
