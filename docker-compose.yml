# Infrastructure for the SubAgents visual assistant.
# The Python app runs on the macOS host (webcam / say / open -a need the host);
# these containers provide persistence and vector search.
#
#   docker compose up -d
#   docker compose ps          # wait until all healthchecks are "healthy"

services:
  postgres:
    image: postgres:16-alpine
    container_name: subagents-postgres
    environment:
      POSTGRES_USER: subagents
      POSTGRES_PASSWORD: subagents
      POSTGRES_DB: subagents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subagents -d subagents"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: subagents-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: subagents-qdrant
    ports:
      - "6333:6333"   # HTTP API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # qdrant image ships no curl/wget — probe the TCP port with bash
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
